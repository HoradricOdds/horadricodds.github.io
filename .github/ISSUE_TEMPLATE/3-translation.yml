name: Translation fix
description: Wording that's wrong, unclear or doesn't match the game in one of the site's languages.
title: "Translation: "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Item, rune, runeword, skill, monster, area and class names come from the game's own translations, so they should match what you see in D2R. Everything else was translated for Horadric Odds. Native speakers are very welcome!
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Español, Português, Deutsch, 한국어, 简体中文]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where on the site?
      placeholder: e.g. Build planner → Gear tab, or How to use
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Copy the text as it appears now (a screenshot is fine too).
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: What it should say
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why (optional)
      description: e.g. it's what the game calls it, the meaning is wrong, or it just sounds unnatural.
